<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Davi eh gay?</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #btnSim {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }

        #btnSim:hover {
            transform: scale(1.1);
            background-color: #218838;
        }

        #btnNao {
            background-color: #dc3545;
            color: white;
            position: absolute;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body>

    <div class="card" id="conteudo">
        <h1>O Davi eh gay?</h1>
        <div class="btn-container">
            <button id="btnSim" onclick="aceitou()">Sim!</button>
            <button id="btnNao" onmouseover="fura()" onclick="fura()" ontouchstart="fura()">Não</button>
        </div>
    </div>

    <script>
        const btnNao = document.getElementById('btnNao');

        // Posiciona o botão Não ao lado do Sim no início
        window.onload = () => {
            const btnSim = document.getElementById('btnSim');
            btnNao.style.left = (btnSim.offsetLeft + btnSim.offsetWidth + 20) + 'px';
            btnNao.style.top = btnSim.offsetTop + 'px';
        };

        function fura() {
            // Calcula novas posições na tela para o botão fugir
            const larguraTela = window.innerWidth - btnNao.offsetWidth - 20;
            const alturaTela = window.innerHeight - btnNao.offsetHeight - 20;

            const novoX = Math.max(20, Math.floor(Math.random() * larguraTela));
            const novoY = Math.max(20, Math.floor(Math.random() * alturaTela));

            btnNao.style.position = 'fixed';
            btnNao.style.left = `${novoX}px`;
            btnNao.style.top = `${novoY}px`;
        }

        function aceitou() {
            const conteudo = document.getElementById('conteudo');
            conteudo.innerHTML = `
                <h1>MTO TCHOLA </h1>
                <p style="font-size: 3rem; margin: 10px 0;">👩‍❤️‍👨✨</p>
                <p style="color: #666;">Te amo!</p>
            `;
        }
    </script>
</body>
</html>
